[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root
loglevel=warn

[program:backend]
command=/bin/sh -lc "source /etc/flowshield/env && cd /app/backend && exec /opt/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning --no-access-log"
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/bin/sh -lc "source /etc/flowshield/env && /opt/flowshield/wait-for-backend.sh && cd /app/backend && exec /opt/venv/bin/python -m app.workers.runner"
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:engine]
command=/bin/sh -lc "source /etc/flowshield/env && /opt/flowshield/wait-for-backend.sh; exec /usr/local/openresty/bin/openresty -g 'daemon off;'"
autostart=true
autorestart=true
priority=30
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:panel]
command=/bin/sh -lc "/opt/flowshield/wait-for-backend.sh && exec /usr/sbin/nginx -g 'daemon off;'"
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
