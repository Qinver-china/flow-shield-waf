worker_processes auto;
error_log /dev/stderr notice;

env REDIS_HOST;
env REDIS_PORT;
env REDIS_SOCKET_PATH;
env REDIS_PASSWORD;
env WAF_CHALLENGE_SECRET;
env WAF_BACKEND_URL;

events {
    worker_connections 10240;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format waf_main '$remote_addr - [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout waf_main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50m;
    resolver 127.0.0.11 ipv6=off valid=30s;

    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_code_cache on;

    lua_shared_dict waf_config 16m;
    lua_shared_dict waf_locks 1m;
    lua_shared_dict waf_ratelimit 50m;
    lua_shared_dict waf_challenge 16m;
    lua_shared_dict waf_traffic 8m;

    init_worker_by_lua_block {
        require("waf.init").start()
    }

    server {
        listen 80 default_server;
        server_name _;
        location / {
            return 444;
        }
        location = /waf-health {
            content_by_lua_block { ngx.say("ok") }
        }
    }

    # app 容器内站点配置目录（与面板 Nginx 的 /etc/nginx/conf.d 分离）
    include /data/engine/conf.d/*.conf;
}
