include /etc/nginx/snippets/geoip2-load.conf;

worker_processes auto;
error_log /dev/stderr error;

env REDIS_HOST;
env REDIS_PORT;
env REDIS_SOCKET_PATH;
env REDIS_PASSWORD;
env WAF_CHALLENGE_SECRET;
env WAF_BACKEND_URL;

events {
    worker_connections 10240;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format waf_main '$remote_addr - [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    include /etc/nginx/snippets/client-max-body.conf;
    include /etc/nginx/snippets/origin-timeout.conf;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # WebSocket only when client sends Upgrade; otherwise Connection: upgrade
    # makes some origin Nginx close the connection before response headers (502).
    map $http_upgrade $waf_connection_upgrade {
        default upgrade;
        ''      close;
    }

    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_code_cache on;

    lua_shared_dict waf_config 16m;
    lua_shared_dict waf_locks 1m;
    lua_shared_dict waf_ratelimit 50m;
    lua_shared_dict waf_challenge 16m;
    lua_shared_dict waf_traffic 8m;

    init_worker_by_lua_block {
        require("waf.init").start()
    }

    # Declare $waf_geoip_client HERE before geoip2 so source= resolves at config load
    # (geoip2 is parsed before conf.d site blocks; http context cannot use `set`).
    server {
        listen 80 default_server;
        server_name _;
        set $waf_geoip_client $remote_addr;
        location ^~ /.well-known/acme-challenge/ {
            alias /data/acme/http-01/;
            default_type text/plain;
        }
        location / {
            return 444;
        }
        location = /waf-health {
            content_by_lua_block { ngx.say("ok") }
        }
    }

    # GeoIP2 must come after $waf_geoip_client is registered (see default_server above).
    include /etc/nginx/snippets/geoip2-http.conf;

    # app 容器内站点配置目录（与面板 Nginx 的 /etc/nginx/conf.d 分离）
    include /data/engine/conf.d/*.conf;
}
