worker_processes auto;
error_log /dev/stderr error;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # HMAC hex 作为 map 键超过默认 64 字节桶
    map_hash_bucket_size 128;

    # 面板安全入口 Cookie 映射（由 render-panel-gate.sh 在启动时写入）
    include /etc/nginx/http.d/panel-gate-map.conf;

    # 仅管理面板 :9000，不占用 80/443（留给 OpenResty 引擎）
    include /etc/nginx/http.d/flowshield-panel.conf;
}
