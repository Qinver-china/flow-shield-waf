upstream flowshield_api {
    server unix:/run/flowshield/backend.sock;
}

server {
    listen 9000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 默认会把 Location 写成绝对地址并带上容器监听端口 9000。
    # 域名反代（443→9000）时浏览器会被带到 example.com:9000。相对跳转沿用当前访问的主机与端口。
    absolute_redirect off;

    # /{PANEL_ENTRANCE} → Set-Cookie 后跳转登录页；未启用时此文件为空
    include /etc/nginx/http.d/panel-gate-locations.conf;

    # Vite 带 hash 的构建产物，内容变则 URL 变，可长期缓存
    location /assets/ {
        include /etc/nginx/snippets/panel-auth-check.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # public/ 下文件名固定，短缓存以免升级后品牌图/图标过久不更新
    location /brand/ {
        include /etc/nginx/snippets/panel-auth-check.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.png {
        include /etc/nginx/snippets/panel-auth-check.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 登录页必须先走安全入口；已登录用户访问业务页用会话 Cookie
    location = /login {
        include /etc/nginx/snippets/panel-gate-check.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # SPA 入口必须每次再验证，否则升级后会继续用旧的 hashed 资源引用
    location = /index.html {
        include /etc/nginx/snippets/panel-auth-check.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        include /etc/nginx/snippets/panel-auth-check.conf;
        try_files $uri $uri/ /index.html;
    }

    # AI 聊天 SSE 流式接口：LLM 推理可能超过 60s，需放宽超时并关闭缓冲
    location = /api/v1/ai-guard/chat/stream {
        include /etc/nginx/snippets/panel-auth-check.conf;
        proxy_pass http://flowshield_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ACME 证书申请 SSE：HTTP-01 验证可能超过默认 60s
    location = /api/v1/certificates/acme/issue/stream {
        include /etc/nginx/snippets/panel-auth-check.conf;
        proxy_pass http://flowshield_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /api/v1/auth/login {
        include /etc/nginx/snippets/panel-gate-check.conf;
        proxy_pass http://flowshield_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /api/v1/auth/setup-status {
        include /etc/nginx/snippets/panel-gate-check.conf;
        proxy_pass http://flowshield_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /api/v1/auth/initial-setup {
        include /etc/nginx/snippets/panel-gate-check.conf;
        proxy_pass http://flowshield_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/ {
        include /etc/nginx/snippets/panel-auth-check.conf;
        proxy_pass http://flowshield_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://flowshield_api/health;
    }
}
