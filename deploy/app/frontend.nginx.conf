upstream flowshield_api {
    server unix:/run/flowshield/backend.sock;
}

server {
    listen 9000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite 带 hash 的构建产物，内容变则 URL 变，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # public/ 下文件名固定，短缓存以免升级后品牌图/图标过久不更新
    location /brand/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.png {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA 入口必须每次再验证，否则升级后会继续用旧的 hashed 资源引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI 聊天 SSE 流式接口：LLM 推理可能超过 60s，需放宽超时并关闭缓冲
    location = /api/v1/ai-guard/chat/stream {
        proxy_pass http://flowshield_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://flowshield_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://flowshield_api/health;
    }
}
