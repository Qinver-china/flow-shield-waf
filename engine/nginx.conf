worker_processes auto;
error_log /dev/stderr notice;

# ---- GeoIP2 (optional) ----
# Enables the geo.* matching fields (geo.country / geo.region / geo.city /
# geo.asn / geo.isp). Requires the ngx_http_geoip2_module and MaxMind .mmdb
# databases. To enable:
#   1) mount your mmdb files to /etc/nginx/geoip (see docker-compose volumes)
#   2) uncomment the load_module line below (build the module if not bundled)
#   3) uncomment the `geoip2 { ... }` blocks inside http {}
# load_module modules/ngx_http_geoip2_module.so;

# pass environment variables into Lua (os.getenv)
env REDIS_HOST;
env REDIS_PORT;
env REDIS_SOCKET_PATH;
env REDIS_PASSWORD;
env WAF_CHALLENGE_SECRET;
env WAF_BACKEND_URL;

events {
    worker_connections 10240;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format waf_main '$remote_addr - [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout waf_main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50m;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # ---- GeoIP2 variable mapping (optional) ----
    # Uncomment together with `load_module` above and mounted .mmdb files.
    # The variable names below MUST match those read by the Lua extractor
    # (waf/extractor.lua): geoip2_country / geoip2_region / geoip2_city /
    # geoip2_asn / geoip2_isp. If your clients sit behind a CDN, set
    # `source=$http_x_forwarded_for` (or the real-ip variable) instead.
    #
    # geoip2 /etc/nginx/geoip/GeoLite2-Country.mmdb {
    #     auto_reload 60m;
    #     $geoip2_country source=$remote_addr country iso_code;
    # }
    # geoip2 /etc/nginx/geoip/GeoLite2-City.mmdb {
    #     $geoip2_region source=$remote_addr subdivisions 0 iso_code;
    #     $geoip2_city   source=$remote_addr city names en;
    # }
    # geoip2 /etc/nginx/geoip/GeoLite2-ASN.mmdb {
    #     $geoip2_asn source=$remote_addr autonomous_system_number;
    #     $geoip2_isp source=$remote_addr autonomous_system_organization;
    # }

    # ---- Lua ----
    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_code_cache on;

    lua_shared_dict waf_config 16m;      # config version / meta
    lua_shared_dict waf_locks 1m;        # sync lock
    lua_shared_dict waf_ratelimit 50m;   # rate limit counters
    lua_shared_dict waf_challenge 16m;   # captcha answers / pending
    lua_shared_dict waf_traffic 8m;      # per-second request counters

    init_worker_by_lua_block {
        require("waf.init").start()
    }

    # default catch-all: unknown hosts get dropped
    server {
        listen 80 default_server;
        server_name _;
        location / {
            return 444;
        }
        location = /waf-health {
            content_by_lua_block { ngx.say("ok") }
        }
    }

    # generated per-site server blocks
    include /etc/nginx/conf.d/*.conf;
}
