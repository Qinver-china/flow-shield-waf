include /etc/nginx/snippets/geoip2-load.conf;

worker_processes auto;
error_log /dev/stderr error;

# pass environment variables into Lua (os.getenv)
env REDIS_HOST;
env REDIS_PORT;
env REDIS_SOCKET_PATH;
env REDIS_PASSWORD;
env WAF_CHALLENGE_SECRET;
env WAF_BACKEND_URL;

events {
    worker_connections 10240;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format waf_main '$remote_addr - [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50m;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # WebSocket only when client sends Upgrade; otherwise Connection: upgrade
    # makes some origin Nginx close the connection before response headers (502).
    map $http_upgrade $waf_connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- Lua ----
    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_code_cache on;

    lua_shared_dict waf_config 16m;      # config version / meta
    lua_shared_dict waf_locks 1m;        # sync lock
    lua_shared_dict waf_ratelimit 50m;   # rate limit counters
    lua_shared_dict waf_challenge 16m;   # captcha answers / pending
    lua_shared_dict waf_traffic 8m;      # per-second request counters

    init_worker_by_lua_block {
        require("waf.init").start()
    }

    # default catch-all: unknown hosts get dropped.
    # Declare $waf_geoip_client HERE before geoip2 so source= resolves at config load
    # (geoip2 is parsed before conf.d site blocks; http context cannot use `set`).
    server {
        listen 80 default_server;
        server_name _;
        set $waf_geoip_client $remote_addr;
        location / {
            return 444;
        }
        location = /waf-health {
            content_by_lua_block { ngx.say("ok") }
        }
    }

    # GeoIP2 must come after $waf_geoip_client is registered (see default_server above).
    # Generated at container start when deploy/geoip/*.mmdb is mounted.
    # Lua reads geoip2_* vars via waf/geo_lookup.lua after access.lua sets the source IP.
    include /etc/nginx/snippets/geoip2-http.conf;

    # generated per-site server blocks
    include /etc/nginx/conf.d/*.conf;
}
