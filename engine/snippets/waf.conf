# Shared WAF snippet included by every generated site server block.
# Requires: `set $waf_site_id "<id>";` defined before include.

# GeoIP2 查询源 IP（须在 server/location 内声明；http 块禁止 set）。
# access.lua 会按站点 client_ip_source 覆盖为真实客户端 IP。
set $waf_geoip_client $remote_addr;

access_by_lua_block {
    require("waf.access").run()
}

# Custom pages when origin is unreachable / timed out (nginx-generated 5xx).
# Do NOT enable proxy_intercept_errors: upstream 404/5xx bodies pass through as-is.
# Keep the original status code; footer comes from settings captcha_footer (Lua).
error_page 502 =502 /__waf_error/502;
error_page 503 =503 /__waf_error/503;
error_page 504 =504 /__waf_error/504;

location = /__waf_error/502 {
    internal;
    content_by_lua_block {
        require("waf.upstream_error").serve(502)
    }
}

location = /__waf_error/503 {
    internal;
    content_by_lua_block {
        require("waf.upstream_error").serve(503)
    }
}

location = /__waf_error/504 {
    internal;
    content_by_lua_block {
        require("waf.upstream_error").serve(504)
    }
}
