# Shared WAF snippet included by every generated site server block.
# Requires: `set $waf_site_id "<id>";` defined before include.

# GeoIP2 查询源 IP（须在 server/location 内声明；http 块禁止 set）。
# access.lua 会按站点 client_ip_source 覆盖为真实客户端 IP。
set $waf_geoip_client $remote_addr;
set $waf_request_id "";

access_by_lua_block {
    require("waf.access").run()
}

header_filter_by_lua_block {
    local rid = ngx.ctx.waf_request_id or ngx.var.waf_request_id
    if type(rid) == "string" and rid ~= "" then
        ngx.header["X-WAF-Request-Id"] = rid
    end
}

# Engine-generated errors only (413, 502, …). Do NOT enable proxy_intercept_errors:
# upstream 404/5xx bodies pass through as-is. Keep the original status code (=CODE);
# footer from settings captcha_footer (Lua).
error_page 400 =400 /__waf_error/400;
error_page 401 =401 /__waf_error/401;
error_page 403 =403 /__waf_error/403;
error_page 404 =404 /__waf_error/404;
error_page 405 =405 /__waf_error/405;
error_page 408 =408 /__waf_error/408;
error_page 413 =413 /__waf_error/413;
error_page 414 =414 /__waf_error/414;
error_page 429 =429 /__waf_error/429;
error_page 500 =500 /__waf_error/500;
error_page 502 =502 /__waf_error/502;
error_page 503 =503 /__waf_error/503;
error_page 504 =504 /__waf_error/504;

location ~ ^/__waf_error/(?<waf_err_status>\d+)$ {
    internal;
    content_by_lua_block {
        require("waf.upstream_error").serve(tonumber(ngx.var.waf_err_status))
    }
}
