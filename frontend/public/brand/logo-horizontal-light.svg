</metadata><defs
     id="defs1"><style id="logo-anim-style">
/* 流盾 WAF LOGO 入场动画 · ZIBLL-老唐 · www.zibll.com */
.anim-dot {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: dotIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.anim-dot-1 { animation-delay: 0s; }
.anim-dot-2 { animation-delay: 0.08s; }
.anim-dot-3 { animation-delay: 0.16s; }
.anim-dot-4 { animation-delay: 0.24s; }
.anim-dot-5 { animation-delay: 0.32s; }
.anim-dot-6 { animation-delay: 0.40s; }
.anim-dot-7 { animation-delay: 0.48s; }
.anim-dot-8 { animation-delay: 0.56s; }
.anim-dot-9 { animation-delay: 0.64s; }
@keyframes dotIn {
  from { opacity: 0; transform: translate(-40px, 20px) scale(0); }
  to { opacity: 1; transform: translate(0, 0) scale(1); }
}
.anim-l {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: lIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
}
@keyframes lIn {
  from { opacity: 0; transform: translate(-50px, 0); }
  to { opacity: 1; transform: translate(0, 0); }
}
.anim-shield-d {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: shieldDIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;
}
@keyframes shieldDIn {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}
.anim-shield-mid {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: shieldMidIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.65s both;
}
@keyframes shieldMidIn {
  from { opacity: 0; transform: translate(0, 12px); }
  to { opacity: 1; transform: translate(0, 0); }
}
.anim-liu {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center bottom;
  animation: liuIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.95s both;
}
@keyframes liuIn {
  from { opacity: 0; transform: scaleY(0); }
  to { opacity: 1; transform: scaleY(1); }
}
.anim-dun {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: left center;
  animation: dunIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) 1.15s both;
}
@keyframes dunIn {
  from { opacity: 0; transform: scaleX(0); }
  to { opacity: 1; transform: scaleX(1); }
}
.anim-letter {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: letterIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.anim-w { animation-delay: 1.4s; }
.anim-a { animation-delay: 1.52s; }
.anim-f { animation-delay: 1.64s; }
@keyframes letterIn {
  from { opacity: 0; transform: translate(0, 20px); }
  to { opacity: 1; transform: translate(0, 0); }
}
.anim-tagline {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: taglineIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) 1.85s both;
}
@keyframes taglineIn {
  from { opacity: 0; transform: translate(0, 8px); }
  to { opacity: 1; transform: translate(0, 0); }
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
}
