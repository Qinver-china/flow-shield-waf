# 流盾WAF (Flow Shield WAF) - 三容器编排
# mysql + redis（官方镜像）+ app（后端/Worker/引擎/面板合一）
name: flowshield-waf

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - waf_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /run/redis
        chown redis:redis /run/redis
        exec su -s /bin/sh redis -c 'exec redis-server \
          --requirepass "$REDIS_PASSWORD" \
          --appendonly yes \
          --unixsocket /run/redis/redis.sock \
          --unixsocketperm 777 \
          --maxclients 10000 \
          --tcp-keepalive 300 \
          --timeout 0'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - redis_run:/run/redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - waf_net

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: waf
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/clickhouse/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - waf_net

  app:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
      args:
        # 海外构建可改为 https://pypi.org/simple 并清空 PIP_TRUSTED_HOST
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
    image: flowshield-waf-app:latest
    container_name: flowshield-waf-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_SOCKET_PATH: /var/run/redis/redis.sock
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_POOL_SIZE: "256"
      REDIS_KEEPALIVE_MS: "60000"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS}
      WAF_ADMIN_USER: ${WAF_ADMIN_USER}
      WAF_ADMIN_PASSWORD: ${WAF_ADMIN_PASSWORD}
      WAF_CHALLENGE_SECRET: ${WAF_CHALLENGE_SECRET}
      WAF_ALLOW_INSECURE_DEFAULTS: ${WAF_ALLOW_INSECURE_DEFAULTS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SLIDE_CAPTCHA_ASSETS_DIR: /data/slide_captcha
      ENABLE_DOCS: ${ENABLE_DOCS}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-waf}
      WAF_ORIGIN_HOST_GATEWAY: ${WAF_ORIGIN_HOST_GATEWAY:-172.17.0.1}
    ports:
      - "${WAF_HTTP_PORT:-80}:80"
      - "${WAF_HTTPS_PORT:-443}:443"
      - "${PANEL_PORT:-9000}:9000"
    volumes:
      - engine_conf:/data/engine/conf.d
      - engine_certs:/data/engine/certs
      - ./slide_captcha:/data/slide_captcha
      - redis_run:/var/run/redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1/waf-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - waf_net

networks:
  waf_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  redis_run:
  clickhouse_data:
  engine_conf:
  engine_certs:
