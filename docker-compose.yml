# 流盾WAF (Flow Shield WAF) - redis + clickhouse + app（后端/Worker/引擎/面板合一）
name: flowshield-waf

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxclients
      - "10000"
      - --tcp-keepalive
      - "300"
      - --timeout
      - "0"
      - --loglevel
      - warning
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      - waf_net

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    # SYS_NICE：允许 get_mempolicy（缺省 Docker seccomp 会拦，刷屏 stderr）
    # IPC_LOCK / NET_ADMIN：官方镜像建议的可选能力，避免相关能力告警
    cap_add:
      - SYS_NICE
      - IPC_LOCK
      - NET_ADMIN
    environment:
      CLICKHOUSE_DB: waf
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/clickhouse/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
      - ./deploy/clickhouse/logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./deploy/clickhouse/disable-query-log.xml:/etc/clickhouse-server/users.d/disable-query-log.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      - waf_net

  app:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
      # Linux 宿主机若构建时 apk/npm 拉包失败（容器桥接网络出网问题），取消下行注释：
      # network: host
      args:
        # 默认海外 PyPI；install.sh --cn 时通过环境变量注入国内源
        PIP_INDEX_URL: ${FSWAF_PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${FSWAF_PIP_TRUSTED_HOST:-}
        ALPINE_MIRROR: ${FSWAF_ALPINE_MIRROR:-}
        NPM_CONFIG_REGISTRY: ${FSWAF_NPM_REGISTRY:-}
        NGINX_MIRROR: ${FSWAF_NGINX_MIRROR:-}
        CARGO_REGISTRY: ${FSWAF_CARGO_REGISTRY:-}
    image: flowshield-waf-app:latest
    container_name: flowshield-waf-app
    restart: unless-stopped
    environment:
      DB_PATH: /data/waf.db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_POOL_SIZE: "256"
      REDIS_KEEPALIVE_MS: "60000"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS}
      WAF_ADMIN_USER: ${WAF_ADMIN_USER}
      WAF_ADMIN_PASSWORD: ${WAF_ADMIN_PASSWORD}
      WAF_CHALLENGE_SECRET: ${WAF_CHALLENGE_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SLIDE_CAPTCHA_ASSETS_DIR: /data/slide_captcha
      ENABLE_DOCS: ${ENABLE_DOCS}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-waf}
      CLICKHOUSE_ASYNC_INSERT: ${CLICKHOUSE_ASYNC_INSERT:-true}
      CLICKHOUSE_HOURLY_MV_ENABLED: ${CLICKHOUSE_HOURLY_MV_ENABLED:-false}
      LOG_COLLECTOR_BATCH_SIZE: ${LOG_COLLECTOR_BATCH_SIZE:-2000}
      LOG_COLLECTOR_MAX_DRAIN_BATCHES: ${LOG_COLLECTOR_MAX_DRAIN_BATCHES:-4}
      LOG_COLLECTOR_BOT_CATALOG_REFRESH_SEC: ${LOG_COLLECTOR_BOT_CATALOG_REFRESH_SEC:-30}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      WAF_ORIGIN_HOST_GATEWAY: ${WAF_ORIGIN_HOST_GATEWAY:-172.17.0.1}
    ports:
      - "${WAF_HTTP_PORT:-80}:80"
      - "${WAF_HTTPS_PORT:-443}:443"
      - "${PANEL_PORT:-9000}:9000"
    volumes:
      - app_data:/data
      - ./deploy/geoip:/etc/nginx/geoip:ro
      - ./slide_captcha:/data/slide_captcha
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1/waf-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *default-logging
    networks:
      - waf_net

networks:
  waf_net:
    driver: bridge

volumes:
  app_data:
  redis_data:
  clickhouse_data:
